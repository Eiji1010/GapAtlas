[project]
name = "gapatlas"
version = "0.1.0"
description = "GapAtlas backend - discover where needs are rising faster than solutions"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.35",
]
llm = [
    "anthropic>=0.40",
]

[project.scripts]
gapatlas = "gapatlas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "boto3-stubs[dynamodb,s3,sqs]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gapatlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "PTH",  # pathlib
    "ARG",  # unused arguments
    "PL",   # pylint
]
ignore = [
    "PLR0913",  # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
"src/gapatlas/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
mypy_path = "src"
packages = ["gapatlas"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: 外部リソースまたは複数コンポーネントを跨ぐテスト",
]
